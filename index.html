<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>行情速览</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E0D12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
<meta name="description" content="A股 / 美股指数 / 港股 / COMEX黄金 / ETF资金流 / 中美国债收益率 实时看板">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行情速览">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-180.png">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/skin-manga.css">
<link rel="stylesheet" href="css/skin-snowmiku.css">
<script>
  // 皮肤必须在样式之后、首屏之前定下来，否则会闪一下原版配色。
  // 优先级：URL 预览参数 > 本机偏好 > 默认雪初音。
  // classic 表示「不设 data-skin」，让 tokens.css 的原版变量生效。
  (function () {
    var s = new URLSearchParams(location.search).get('skin');
    if (!s) {
      try {
        var p = (JSON.parse(localStorage.getItem('stk.watch.v1') || '{}').prefs) || {};
        s = ('skin' in p && p.skin) ? p.skin : 'snowmiku';
      } catch (e) { s = 'snowmiku'; }
    }
    if (s && s !== 'classic') document.documentElement.dataset.skin = s;
  })();
</script>
<script src="version.js"></script>
<script>
  // 首屏前确定明暗，避免白闪。
  // 默认雪初音是雪白底，所以新装与「尚未写过 skin 的老数据」都先按浅色渲染，
  // 与 store.js 的 migratePrefs() 保持一致；老数据启动后会正式迁移并落盘。
  (function () {
    var theme = 'light';
    try {
      var raw = localStorage.getItem('stk.watch.v1');
      var p = raw ? (JSON.parse(raw).prefs || {}) : null;
      if (p && 'skin' in p) {
        if (p.theme === 'dark') theme = 'dark';
        else if (p.theme === 'auto') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
      }
    } catch (e) { /* 忽略，保持浅色 */ }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div class="miku-bg" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- 飘落的花瓣（纯装饰，不可交互） -->
  <div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <!-- ======== 自选看板 ======== -->
  <section class="page" id="page-board" data-page="board">
    <header class="topbar">
      <div class="topbar__title">
        <h1>行情速览</h1>
        <span class="topbar__status" id="board-status">连接中</span>
      </div>
      <div class="topbar__acts">
        <button class="iconbtn" id="board-sort" type="button" aria-label="切换排序">
          <span class="iconbtn__text" id="board-sort-label">涨跌幅</span>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="textbtn" id="board-edit" type="button" aria-label="编辑自选">编辑</button>
      </div>
    </header>
    <div class="pull" id="pull-indicator"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="board" id="board-list">
      <!-- 骨架 -->
      <div class="skel">
        <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
        <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
        <div class="skel__row"></div><div class="skel__row"></div>
      </div>
    </div>
    <div class="board__empty" id="board-empty" hidden>
      <p class="board__empty-title">还没有自选喵</p>
      <p class="board__empty-sub">去搜索页牵几个指数、个股或 ETF 回来吧</p>
      <button class="btn btn--primary" id="board-empty-btn" type="button">去逛逛</button>
      <button class="btn btn--ghost board__empty-restore" id="board-empty-restore" type="button">恢复默认清单</button>
    </div>
  </section>

  <!-- ======== 指数（可自选增删） ======== -->
  <section class="page" id="page-indices" data-page="indices" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>指数行情</h1>
        <span class="topbar__status" id="indices-status">连接中</span>
      </div>
      <div class="topbar__acts">
        <button class="iconbtn" id="idx-add" type="button" aria-label="调整指数">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="iconbtn__text">调整</span>
        </button>
      </div>
    </header>
    <div class="pull" id="indices-pull"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="scroll idxscroll" id="indices-list"></div>
  </section>

  <!-- ======== 行情分析（相似历史日匹配） ======== -->
  <section class="page" id="page-analysis" data-page="analysis" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>行情分析</h1>
        <span class="topbar__status" id="analysis-status">连接中</span>
      </div>
    </header>
    <div class="pull" id="analysis-pull"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="scroll anscroll" id="analysis-body"></div>
  </section>

  <!-- ======== 国债收益率（中美） ======== -->
  <section class="page" id="page-bonds" data-page="bonds" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>国债收益率</h1>
        <span class="topbar__status" id="bonds-status">连接中</span>
      </div>
    </header>
    <div class="pull" id="bonds-pull"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="scroll bondscroll" id="bonds-body"></div>
  </section>

  <!-- ======== 国家队追踪 ======== -->
  <section class="page" id="page-nteam" data-page="nteam" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>国家队追踪</h1>
        <span class="topbar__status" id="nteam-status">连接中</span>
      </div>
      <div class="topbar__acts">
        <button class="textbtn" id="nteam-edit" type="button" aria-label="编辑国家队">编辑</button>
      </div>
    </header>
    <div class="pull" id="nteam-pull"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="board" id="nteam-list"></div>
    <div class="nte-sum" id="nteam-sum" hidden>
      <div class="nte-sum__cell nte-sum__cell--tap" data-sum="vol" role="button" tabindex="0" aria-label="查看成交量汇总比照">
        <strong class="nte-sum__val" id="nteam-vol">--</strong>
        <span class="nte-sum__note" id="nteam-volnote">今日合计成交量</span>
      </div>
      <div class="nte-sum__sep"></div>
      <div class="nte-sum__cell nte-sum__cell--tap" data-sum="flow" role="button" tabindex="0" aria-label="查看资金量汇总比照">
        <strong class="nte-sum__val" id="nteam-flow">--</strong>
        <span class="nte-sum__note" id="nteam-flownote">资金量汇总</span>
      </div>
    </div>
  </section>

  <!-- ======== 好人好股 ======== -->
  <section class="page" id="page-hao" data-page="hao" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>好人好股</h1>
        <span class="topbar__status" id="hao-status">连接中</span>
      </div>
    </header>
    <div class="pull" id="hao-pull"><span class="pull__spinner"></span><span class="pull__text">下拉刷新</span></div>
    <div class="board" id="hao-list"></div>
  </section>

  <!-- ======== 搜索 ======== -->
  <section class="page" id="page-search" data-page="search" hidden>
    <header class="topbar topbar--search">
      <div class="searchbar">
        <svg class="searchbar__icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13.5 13.5L17 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="搜索代码 / 名称，如 588000、沪深300">
        <button class="searchbar__clear" id="search-clear" type="button" aria-label="清空" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="search" id="search-body"></div>
  </section>

  <!-- ======== 设置 ======== -->
  <section class="page" id="page-settings" data-page="settings" hidden>
    <header class="topbar">
      <div class="topbar__title">
        <h1>设置</h1>
        <span class="topbar__status" data-live="0">偏好只存在这台手机</span>
      </div>
      <div class="topbar__acts"><span class="verpill" data-ver></span></div>
    </header>
    <div class="settings" id="settings-body"></div>
  </section>

  <!-- ======== 详情（覆盖层） ======== -->
  <section class="detail" id="page-detail" data-page="detail" hidden>
    <div class="detail__body" id="detail-body"></div>
  </section>

  <!-- ======== 底部导航 ======== -->
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tabbar__item is-active" data-tab="board" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8v18.4M3.9 7.4l16.2 9.2M20.1 7.4L3.9 16.6"/>
          <path d="M12 6.5l2.4-2M12 6.5L9.6 4.5M12 17.5l2.4 2M12 17.5l-2.4 2"/>
          <path d="M7.2 9.7l-2.9-.4M7.2 9.7l-.6-2.9M16.8 14.3l2.9.4M16.8 14.3l.6 2.9"/>
        </g>
        <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
      </svg>
      <span>自选</span>
    </button>
    <button class="tabbar__item" data-tab="indices" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3.2 18.2l4.6-5.3 3.3 2.6 4.6-6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.2 5.6l2.4 2.8-2.4 2.8-2.4-2.8z" fill="currentColor"/>
      </svg>
      <span>指数</span>
    </button>
    <button class="tabbar__item" data-tab="analysis" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 3.1l7.5 4.3v9.2L12 20.9l-7.5-4.3V7.4z" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M12 8.3v4.1l2.7 1.7" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>行情分析</span>
    </button>
    <button class="tabbar__item" data-tab="bonds" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3.4 19.6h17.2" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"/>
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2">
          <path d="M6.6 19.6v-5.6M12 19.6v-9.4M17.4 19.6v-7.2"/>
        </g>
        <g fill="currentColor">
          <circle cx="6.6" cy="12.6" r="1.25"/><circle cx="12" cy="8.8" r="1.25"/><circle cx="17.4" cy="11" r="1.25"/>
        </g>
      </svg>
      <span>国债</span>
    </button>
    <button class="tabbar__item" data-tab="nteam" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 2.8l7.4 3v5.4c0 4.6-3.1 8.3-7.4 10-4.3-1.7-7.4-5.4-7.4-10V5.8z" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 8.7v6.6M9.1 10.4l5.8 3.2M14.9 10.4l-5.8 3.2" fill="none"
              stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
      </svg>
      <span>国家队</span>
    </button>
    <button class="tabbar__item" data-tab="hao" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M10.6 3.6c.5 4.1 1.9 5.5 6 6-4.1.5-5.5 1.9-6 6-.5-4.1-1.9-5.5-6-6 4.1-.5 5.5-1.9 6-6z"
              fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/>
        <path d="M17.3 14.9c.2 1.7.8 2.3 2.5 2.5-1.7.2-2.3.8-2.5 2.5-.2-1.7-.8-2.3-2.5-2.5 1.7-.2 2.3-.8 2.5-2.5z"
              fill="currentColor"/>
      </svg>
      <span>好人好股</span>
    </button>
    <button class="tabbar__item" data-tab="search" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="10.6" cy="10.6" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M15.7 15.7l4.7 4.7" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
        <path d="M10.6 7.3v6.6M8.1 8.8l5 3.3M13.1 8.8l-5 3.3" fill="none"
              stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
      <span>搜索</span>
    </button>
    <button class="tabbar__item" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 2.9v3.1M12 18v3.1M4.7 7.5l2.7 1.6M16.6 14.9l2.7 1.6M4.7 16.5l2.7-1.6M16.6 9.1l2.7-1.6"/>
        </g>
      </svg>
      <span>设置</span>
    </button>
  </nav>

  <!-- ======== 指数选择抽屉 ======== -->
  <div class="ipicker" id="idx-picker" hidden>
    <div class="ipicker__sheet" role="dialog" aria-modal="true" aria-label="选择要显示的指数">
      <div class="ipicker__head">
        <div class="ipicker__title">
          <h2>我的指数</h2>
          <p>勾选后立即显示在指数页</p>
        </div>
        <button class="ipicker__done" id="idx-picker-done" type="button">完成</button>
      </div>
      <div class="ipicker__list" id="idx-picker-list"></div>
    </div>
  </div>

</div>

<div class="toast-host" id="toast-host"></div>
<div class="update-bar" id="update-bar" hidden>
  <span>有新版本可用</span>
  <button type="button" id="update-btn">立即刷新</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
